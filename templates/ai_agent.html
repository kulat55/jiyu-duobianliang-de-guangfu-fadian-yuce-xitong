<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <title>Qwen AI智能助手</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body class="dashboard-body">


<div class="top-bar">

    <div>

        <h1>AI智能助手</h1>

        <p>Qwen Intelligent Assistant</p>

    </div>


    <div class="top-status">

        <span>Qwen 服务在线</span>

        <a href="/">返回首页</a>

    </div>

</div>


<div class="screen-container">


    <!-- ============================= -->
    <!-- 页面介绍 -->
    <!-- ============================= -->

    <div class="hero-card">

        <h2>光伏发电智能问答系统</h2>

        <p>

            基于 Qwen千问大语言模型构建，

            支持光伏发电分析、系统运行解释、

            发电趋势分析与智能数据分析。

        </p>

    </div>



    <div class="main-grid">


        <!-- ============================= -->
        <!-- AI问题输入 -->
        <!-- ============================= -->

        <div class="panel">


            <div class="panel-title">

                <h3>AI问题输入</h3>

                <span>
                    Qwen AI
                </span>

            </div>



            <form method="post">


                <!-- 模型状态 -->

                <div
                    style="
                        margin-bottom: 18px;
                        padding: 12px 15px;
                        border-radius: 6px;
                        background: rgba(0, 150, 255, 0.08);
                        border-left: 3px solid #36a9e1;
                        color: #dff7ff;
                    "
                >

                    当前 AI 模型：

                    <strong>
                        Qwen千问
                    </strong>

                </div>



                <!-- 问题 -->

                <div class="form-group">

                    <label>
                        请输入问题
                    </label>


                    <textarea
                        name="question"
                        rows="8"
                        placeholder="例如：请分析当前光伏电站运行情况"
                        required
                    >{{ question or '' }}</textarea>

                </div>



                <!-- 提交 -->

                <button
                    class="login-btn"
                    type="submit"
                >

                    提问 Qwen千问

                </button>


            </form>

        </div>



        <!-- ============================= -->
        <!-- 功能说明 -->
        <!-- ============================= -->

        <div class="panel">


            <div class="panel-title">

                <h3>功能说明</h3>

                <span>
                    System Capability
                </span>

            </div>


            <div class="status-list">


                <div class="status-item">

                    <span>
                        AI模型
                    </span>

                    <strong>
                        Qwen千问
                    </strong>

                </div>


                <div class="status-item">

                    <span>
                        光伏数据分析
                    </span>

                    <strong>
                        支持
                    </strong>

                </div>


                <div class="status-item">

                    <span>
                        发电趋势预测
                    </span>

                    <strong>
                        支持
                    </strong>

                </div>


                <div class="status-item">

                    <span>
                        运行状态解释
                    </span>

                    <strong>
                        支持
                    </strong>

                </div>


                <div class="status-item">

                    <span>
                        AI自然语言问答
                    </span>

                    <strong>
                        支持
                    </strong>

                </div>


            </div>

        </div>


    </div>



    <!-- ============================= -->
    <!-- AI回答 -->
    <!-- ============================= -->

    {% if answer %}

    <div
        class="panel"
        style="margin-top: 24px;"
    >


        <div class="panel-title">

            <h3>
                AI分析结果
            </h3>

            <span>
                Qwen千问
            </span>

        </div>


        <div
            style="
                line-height: 2;
                color: #dff7ff;
                white-space: pre-wrap;
                font-size: 15px;
            "
        >

            {{ answer }}

        </div>


    </div>

    {% endif %}


</div>


</body>

</html>
